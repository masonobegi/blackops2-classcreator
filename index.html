<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Black Ops II · Create-A-Class</title>

<!-- Link preview (iMessage / iOS, Discord, etc.) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Black Ops II — Create-A-Class" />
<meta property="og:description" content="Build your loadout. Press ENTER to deploy." />
<meta property="og:image" content="og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Black Ops II — Create-A-Class" />
<meta name="twitter:description" content="Build your loadout. Press ENTER to deploy." />
<meta name="twitter:image" content="og.png" />
<meta name="theme-color" content="#f7941e" />
<link rel="icon" type="image/png" href="og.png" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0b0d;
    overflow: hidden;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    color: #d7d9dc;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===================== MINIMAL BO2 HOME SCREEN ===================== */
  #bo2 {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(130% 90% at 50% 30%, #1c1f24 0%, #101216 55%, #08090b 100%);
  }

  .logo {
    font-size: clamp(30px, 7vw, 64px);
    font-weight: 800;
    letter-spacing: clamp(6px, 2vw, 16px);
    text-transform: uppercase;
    color: #f4f5f6;
    line-height: 1.05;
  }
  .logo .ii { color: #f7941e; }
  .subtitle {
    margin-top: 14px;
    font-size: clamp(13px, 2.4vw, 18px);
    letter-spacing: clamp(4px, 1.4vw, 9px);
    text-transform: uppercase;
    color: #8b9096;
  }

  .rule {
    width: min(360px, 70vw);
    height: 2px;
    margin: 34px 0 30px;
    background: linear-gradient(90deg, transparent, #f7941e, transparent);
  }

  #enter {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #10120f;
    background: linear-gradient(180deg, #ffb347, #f7941e);
    padding: 15px 54px;
    clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
    box-shadow: 0 0 0 1px rgba(247,148,30,.4), 0 8px 26px rgba(247,148,30,.22);
  }
  #enter:hover { filter: brightness(1.08); }
  #enter:active { transform: translateY(2px); }

  .press {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #5a5f65;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }

  .foot {
    position: fixed;
    bottom: 16px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #3f4348;
    text-transform: uppercase;
  }

  /* ===================== MEME LAYER (revealed on ENTER) ===================== */
  #meme-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: none;
  }
  #meme {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- The meme sits underneath, hidden until ENTER -->
  <div id="meme-layer">
    <img id="meme" src="jack.jpeg" alt="" />
    <audio id="fart" src="fart.mp3" loop></audio>
  </div>

  <!-- Minimal Black Ops II home screen -->
  <div id="bo2">
    <div class="logo">BLACK OPS <span class="ii">II</span></div>
    <div class="subtitle">Create-A-Class</div>
    <div class="rule"></div>
    <button id="enter">ENTER</button>
    <div class="press">Press to deploy</div>
    <div class="foot">© Activision · Treyarch</div>
  </div>

  <script>
    const enter = document.getElementById('enter');
    const bo2 = document.getElementById('bo2');
    const memeLayer = document.getElementById('meme-layer');
    const fart = document.getElementById('fart');

    enter.addEventListener('click', () => {
      // The click IS the user gesture, so audio is allowed to play.
      memeLayer.style.display = 'block';
      bo2.style.display = 'none';
      fart.currentTime = 0;
      fart.play().catch(() => {});
    });
  </script>
</body>
</html>
