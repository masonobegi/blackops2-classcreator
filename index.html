<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JACK</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #meme {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  #surprise {
    position: fixed;
    left: 50%;
    bottom: 6vh;
    transform: translateX(-50%);
    z-index: 10;
    padding: 18px 30px;
    font-size: 5vw;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    background: #e63b2e;
    border: 4px solid #fff;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    animation: wob 0.6s ease-in-out infinite alternate;
  }
  #surprise:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  @keyframes wob { from { rotate: -3deg; } to { rotate: 3deg; } }
  @media (min-width: 700px) { #surprise { font-size: 28px; } }
</style>
</head>
<body>
  <img id="meme" src="jack.jpeg" alt="jack" />
  <audio id="fart" src="fart.mp3" loop autoplay></audio>
  <button id="surprise">CLICK HERE FOR A SURPRISE 💨</button>

  <script>
    const fart = document.getElementById('fart');

    // Try to start the loop immediately on page open.
    const go = () => { const p = fart.play(); if (p) p.catch(() => {}); };
    go();

    // The surprise button (re)starts / guarantees the fart noise.
    document.getElementById('surprise').addEventListener('click', () => {
      fart.currentTime = 0;
      fart.play().catch(() => {});
    });

    // Fallback: if autoplay was blocked, kick it off on the first interaction.
    const kick = () => fart.play().catch(() => {});
    ['pointerdown', 'touchstart', 'keydown'].forEach((e) =>
      window.addEventListener(e, kick, { passive: true })
    );
  </script>
</body>
</html>
