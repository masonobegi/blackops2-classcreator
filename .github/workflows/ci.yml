name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ for native TypeScript execution and node:sqlite.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Boot check
        # Catches configuration and wiring mistakes that unit tests can miss.
        env:
          SESSION_SECRET: ci-only-secret-not-used-anywhere
          PORT: '8123'
          BASE_URL: http://127.0.0.1:8123
          DATABASE_PATH: ./ci-data/driftwatch.db
          SCHEDULER_ENABLED: '0'
        run: |
          node --disable-warning=ExperimentalWarning src/index.ts &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8123/healthz" > /dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:8123/healthz"
          curl -fsS -o /dev/null "http://127.0.0.1:8123/"
          curl -fsS -o /dev/null "http://127.0.0.1:8123/docs"
          kill "$pid"
